<svg width="450" height="220" viewBox="0 0 450 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .header { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; font-size: 16px; font-weight: 700; fill: #FF6A00; }
    .subtext { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; font-size: 10px; font-weight: 500; fill: #8B949E; }
    .lang-name { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; font-size: 13px; font-weight: 600; fill: #E6EDF3; }
    .lang-pct { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; font-size: 12px; font-weight: 500; fill: #8B949E; }
    .lang-desc { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; font-size: 11px; font-weight: 400; fill: #6E7681; }
    .bar-bg { rx: 4px; ry: 4px; fill: #21262D; }
    .bar-fill { rx: 4px; ry: 4px; }
  </style>

  <rect width="450" height="220" rx="10" fill="#0D1117" stroke="#30363D" stroke-width="1"/>

  <!-- Header -->
  <text x="24" y="32" class="header">⚡ Core Engineering Distribution</text>
  <text x="24" y="48" class="subtext">ACROSS ACTIVE PRODUCTION &amp; PRIVATE REPOSITORIES</text>

  <!-- Multi-segment bar -->
  <g transform="translate(24, 60)">
    <rect width="402" height="10" rx="5" fill="#21262D"/>
    <rect x="0" width="161" height="10" rx="5" fill="#7F52FF"/>
    <rect x="163" width="121" height="10" rx="0" fill="#3178C6"/>
    <rect x="286" width="64" height="10" rx="0" fill="#3572A5"/>
    <rect x="352" width="36" height="10" rx="0" fill="#F34B7D"/>
    <rect x="390" width="12" height="10" rx="5" fill="#89E051"/>
  </g>

  <!-- Legend List -->
  <!-- Kotlin -->
  <g transform="translate(24, 94)">
    <circle cx="6" cy="6" r="5" fill="#7F52FF"/>
    <text x="18" y="10" class="lang-name">Kotlin</text>
    <text x="75" y="10" class="lang-pct">40.0%</text>
    <text x="135" y="10" class="lang-desc">• Android Core, Jetpack Compose, NextSheild App</text>
  </g>

  <!-- TypeScript -->
  <g transform="translate(24, 118)">
    <circle cx="6" cy="6" r="5" fill="#3178C6"/>
    <text x="18" y="10" class="lang-name">TypeScript</text>
    <text x="100" y="10" class="lang-pct">30.0%</text>
    <text x="155" y="10" class="lang-desc">• NextSheild Core, Leadgram CRM &amp; AI Bots</text>
  </g>

  <!-- Python -->
  <g transform="translate(24, 142)">
    <circle cx="6" cy="6" r="5" fill="#3572A5"/>
    <text x="18" y="10" class="lang-name">Python</text>
    <text x="80" y="10" class="lang-pct">16.0%</text>
    <text x="135" y="10" class="lang-desc">• AI Automation, Audio Streaming &amp; Telemetry</text>
  </g>

  <!-- C++ -->
  <g transform="translate(24, 166)">
    <circle cx="6" cy="6" r="5" fill="#F34B7D"/>
    <text x="18" y="10" class="lang-name">C++</text>
    <text x="55" y="10" class="lang-pct">9.0%</text>
    <text x="110" y="10" class="lang-desc">• OpenVPN 3 Engine, Tun Driver &amp; JNI Bridge</text>
  </g>

  <!-- Shell -->
  <g transform="translate(24, 190)">
    <circle cx="6" cy="6" r="5" fill="#89E051"/>
    <text x="18" y="10" class="lang-name">Shell / Bash</text>
    <text x="110" y="10" class="lang-pct">5.0%</text>
    <text x="160" y="10" class="lang-desc">• GRE-TCP Forwarders, Linux Networking</text>
  </g>
</svg>
